name: Automatizacion de Noticias

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  procesar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar librerías fijadas
        run: python -m pip install --requirement requirements.txt

      - name: Ejecutar la IA
        env:
          LLAVESECRETABRAI: ${{ secrets.LLAVESECRETABRAI }}
        run: python recolector.py

      - name: Guardar solo los archivos generados
        run: |
          git config user.name 'Bot de Noticias'
          git config user.email 'bot@users.noreply.github.com'
          git add -- index.html historial.txt
          if git diff --cached --quiet; then
            echo 'Sin cambios para publicar'
            exit 0
          fi
          git commit -m 'Actualizar noticias automáticamente'
          git push
